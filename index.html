<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCC All Industries Career Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans">

    <!-- Header / Navigation Menu -->
    <header class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold tracking-tight text-emerald-400">GCC<span class="text-white">Jobs.io</span></a>
            <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-zinc-300">
                <a href="index.html" class="hover:text-emerald-400 transition text-emerald-400">Home</a>
                <a href="kuwait.html" class="hover:text-emerald-400 transition">Kuwait</a>
                <a href="uae.html" class="hover:text-emerald-400 transition">UAE</a>
                <a href="ksa.html" class="hover:text-emerald-400 transition">KSA</a>
                <a href="remote.html" class="hover:text-emerald-400 transition">Remote</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <main class="max-w-6xl mx-auto px-6 py-16">
        <div class="text-center max-w-2xl mx-auto mb-16">
            <span class="text-xs uppercase tracking-widest px-3 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/50 font-semibold">Live Multi-Industry Opportunities</span>
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mt-4">GCC Career Hub Across All Sectors</h1>
            <p class="text-zinc-400 mt-4 text-base">Explore live automated listings spanning engineering, teaching, medical, IT, walk-in drives, and remote contracts.</p>
        </div>

        <!-- Dynamic Content Container -->
        <div id="job-categories-container" class="space-y-12">
            <div class="text-center text-zinc-500 py-12">Loading live job listings...</div>
        </div>
    </main>

    <script>
        async function loadJobs() {
            try {
                const response = await fetch('jobs.json');
                if (!response.ok) throw new Error('Failed to load data');
                const data = await response.json();

                const container = document.getElementById('job-categories-container');
                container.innerHTML = '';

                if (data.categories && data.categories.length > 0) {
                    data.categories.forEach(category => {
                        let categoryHTML = `
                            <div>
                                <h3 class="text-2xl font-bold tracking-tight mb-6 text-emerald-400 border-b border-zinc-800 pb-2">${category.name}</h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        `;

                        category.listings.forEach(job => {
                            categoryHTML += `
                                <div class="p-6 rounded-xl bg-zinc-900 border border-zinc-800 flex flex-col justify-between hover:border-emerald-500/50 transition">
                                    <div>
                                        <div class="flex justify-between items-start gap-2">
                                            <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/50 font-medium">${job.country}</span>
                                            <span class="text-xs text-zinc-400 bg-zinc-800 px-2.5 py-1 rounded-full">${job.type}</span>
                                        </div>
                                        <h4 class="text-lg font-semibold mt-3 text-zinc-100">${job.title}</h4>
                                        <p class="text-sm text-zinc-400 mt-1">${job.company} &bull; ${job.location}</p>
                                    </div>
                                    <div class="mt-6 pt-4 border-t border-zinc-800/85 flex justify-end">
                                        <a href="${job.apply_url}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-zinc-800 hover:bg-emerald-500 hover:text-zinc-950 text-zinc-100 font-semibold text-sm rounded-lg transition cursor-pointer inline-block">
                                            Apply Now &rarr;
                                        </a>
                                    </div>
                                </div>
                            `;
                        });

                        categoryHTML += `</div></div>`;
                        container.innerHTML += categoryHTML;
                    });
                }
            } catch (error) {
                console.error('Error loading jobs:', error);
                document.getElementById('job-categories-container').innerHTML = `
                    <div class="text-center text-zinc-400 py-12">
                        <p>Listings are updating. Please check back shortly!</p>
                    </div>
                `;
            }
        }

        loadJobs();
    </script>
</body>
</html>
